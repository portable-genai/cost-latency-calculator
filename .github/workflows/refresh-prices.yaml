name: Refresh prices

# Validates calc/prices.json on every push, and on a monthly schedule refreshes it
# from a live source (when one is wired into scripts/refresh_prices.py) and commits
# any change. Commits are authored as the repo owner (no co-author trailer); the
# jsDelivr cache for prices.json is purged so updates propagate within minutes.

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}
  push:
    paths: ["calc/prices.json", "scripts/refresh_prices.py"]

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and refresh prices
        run: python scripts/refresh_prices.py

      - name: Commit if prices changed
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain calc/prices.json)" ]; then
            git config user.name "Ashish Awasthi"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add calc/prices.json
            git commit -m "Refresh prices.json ($(date -u +%Y-%m-%d))"
            git push
            curl -s "https://purge.jsdelivr.net/gh/portable-genai/cost-latency-calculator@main/calc/prices.json" > /dev/null || true
            echo "prices.json updated and jsDelivr cache purged."
          else
            echo "prices.json unchanged."
          fi
